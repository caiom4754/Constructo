<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <!-- Font Awesome -->

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<body>
    <header>
        <nav
            class="nav-bg navbar navbar-expand-lg navbar-dark bg-dark d-flex justify-content-center align-items-center">
            <img src="../img/logo_melhorada.png" alt="Logo" class="img-fluid">
        </nav>
    </header>


    <main>
        <article>
            <label for="metrosLinearesCalculadoraPage">Total de metros lineares das paredes</label>
            <br>
            <input type="number" step="0.5" id="metrosLinearesCalculadoraPage">
            <br>
            <label for="alturaParedeCalculadoraPage">Altura média das paredes</label>
            <br>
            <input type="number" step="0.5" id="alturaParedeCalculadoraPage">
        </article>
    </main>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="footer-top">
            <div class="footer-item">
                <i class="fas fa-calculator"></i>
                <p>Calcule a quantidade de materiais necessários utilizando as medidas da sua construção</p>
                <a href="./info.html"><i class="fas fa-arrow-right"></i></a>
            </div>
        </div>

        <hr class="linha-separadora">

        <div class="footer-bottom">
            <div class="footer-item">
                <i class="fas fa-info-circle"></i>
                <p>Calcule a quantidade de materiais necessários utilizando as medidas da sua construção</p>
                <a href="./info.html"><i class="fas fa-arrow-right"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
