<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <a href="../index.html">
            <img src="../img/logo_melhorada.png" alt="Logo" class="img-fluid" style="max-height: 80px" />
        </a>
    </header>
        <nav class="row justify-content-center position-absolute start-0 end-0 mx-auto"
        style="width: 90%; max-width: 9.6em;">
        <a href="../index.html"
            class="d-flex justify-content-center col-5 col-md-3 mx-2 text-decoration-none">
            <section class="p-3 rounded-bottom text-center card-nav">
                <i class="fas fa-home fa-lg" style="color: #E67E22"></i>
                <span class="d-block mt-1"></span>
            </section>
        </a>
        <a href="../html/teste.html" class="d-flex justify-content-center col-5 col-md-3 mx-2 text-decoration-none">
            <section class="p-3 rounded-bottom text-center card-nav">
                <i class="fas fa-info-circle fa-lg" style="color: #E67E22"></i>
                <span class="d-block mt-1" style="color: #E67E22"></span>
            </section>
        </a>
    </nav>

    <main class="container py-4" style="margin-top: 4em;">
        <div class="row g-4">
            <div class="col-md-6 col-lg-4">
                <div class="mb-3">
                    <label for="metrosLineares" class="form-label">Total de metros lineares das paredes</label>
                    <input type="number" step="0.5" id="metrosLineares" class="form-control" />
                </div>

                <div class="mb-3">
                    <label for="alturaParede" class="form-label">Altura média das paredes</label>
                    <input type="number" step="0.5" id="alturaParede" class="form-control" />
                </div>

                <div class="mb-3">
                    <label for="tipoBloco" class="form-label">Tipo de Bloco</label>
                    <select id="tipoBloco" class="form-select">
                        <option value="concreto34x19x14">Concreto 34 x 19 x 14</option>
                        <option value="ceramico19x19x09">Cerâmico 19 x 19 x 09</option>
                        <option value="ecologico25x12.5x6.25">Ecológico 25 x 12.5 x 6.25</option>
                    </select>
                </div>
            </div>

            <!-- Aberturas -->
            <div class="col-md-6 col-lg-4">
                <div class="mb-3">
                    <label class="form-label d-block">Dimensões de Portas e Janelas</label>
                    <button onclick="DimensaoPortasJanelas()" class="btn-sm mb-3 justify-content-center">
                        + Adicionar Porta/Janela
                    </button>
                    <div id="dimensions-container-calculadora" class="d-flex flex-column gap-2"></div>
                </div>
            </div>

            <!-- Resultado -->
            <div class="col-12 col-lg-4 d-flex flex-column align-items-center">
                <button id="calcularButton" class="btn btn-success mb-3 w-100">Calcular</button>

                <h5 class="text-center">Materiais necessários:</h5>
                <div id="resultadosMateriais" class="w-100 border p-3 rounded bg-light resultadoMateriais"
                    style="margin-top: 1.8em;">
                    <ul class="mb-0">
                        <li>Blocos: 0</li>
                        <li>Cimento: 0 sacos (50kg)</li>
                        <li>Areia: 0 m³</li>
                        <li>Água: 0 litros</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
  <footer class="mt-5"  style="display: flex;">
        <div class="col-3"></div>
        <div class="col-3">
            <p>Faculdade de Tecnologia de São Roque - Fatec-SR <br>2024 - 2025</p>
            </div>
        <div class="col-3">
            <p>Desenvolvedores: Caio Martins & Vinicius Venâncio <br>Orientador: Professor Rubens Menezes</p>
        </div>
        <div class="col-3"></div>
    </footer>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/script_calculadora.js"></script>
</body>

</html>
