<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Blocos</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="800" height="400" style="float: left;"></canvas>
    <br>

    <label for="tipoBloco">Tipo de Bloco:</label>
    <select id="tipoBloco">
        <option value="concreto34x19x14">Concreto 34 x 19 x 14</option>
        <option value="ceramico19x19x09">Cerâmico 19 x 19 x 09</option>
        <option value="ecologico25x12.5x6.25">Ecológico 25 x 12.5 x 6.25</option>
    </select>
    <br>

    <label for="alturaParede">Altura da Parede (m):</label>
    <input type="number" id="alturaParede" min="0.0" step="0.5">
    <br>

    <button id="calcularButton">Calcular</button>
    <button id="undoButton">Desfazer</button>
    <br>

    <label for="nomeProjeto">Nome do Projeto</label>
    <input type="text" id="nomeProjeto">
    <br>
    <!-- Botões para baixar e carregar JSON -->
    <button id="baixarProjetoButton">Baixar Projeto</button>
    <input type="file" id="carregarArquivoInput" style="display:none;">
    <br>
    <button id="carregarArquivoButton">Carregar Projeto</button>

    <div id="resultadosMateriais"></div>

    <h2>Dimensões de Portas e Janelas</h2>
    <div id="dimensions-container">
    </div>
    <button onclick="DimensaoPortasJanelas()">+ Adicionar Porta/Janela</button>

    <script src="script.js"></script>
</body>

</html>
