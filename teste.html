<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Blocos</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="800" height="400" style="float: left;"></canvas>
    <br>
    <label for="tipoBloco">Tipo de Bloco:</label>
    <select id="tipoBloco">
        <option value="concreto39x19x14">Concreto 39x19x14</option>
        <option value="ceramico19x19">Cerâmico 19x19</option>
        <option value="ceramicoEstrutural29x19">Cerâmico Estrutural 29x19</option>
        <option value="concretoCelular60x20">Concreto Celular 60x20</option>
        <option value="silicioCalcio25x20">Silício Cálcio 25x20</option>
    </select>
    <br>
    <label for="alturaParede">Altura da Parede (m):</label>
    <input type="number" id="alturaParede" min="0.1" step="0.01">
    <br>
    <button id="calcularButton">Calcular</button>
    <button id="undoButton">Desfazer</button>
    <br>
    <div id="resultadosBlocos"></div>
    <div id="resultadosMateriais"></div>

    <br>
    <!-- Botões para baixar e carregar JSON -->
    <button id="baixarProjetoButton">Baixar Projeto (JSON)</button>
    <input type="file" id="carregarArquivoInput" style="display:none;">
    <br>
    <button id="carregarArquivoButton">Carregar Projeto (JSON)</button>

    <!-- Exibição de resultados -->
    <div id="resultadosBlocos"></div>
    <div id="resultadosMateriais"></div>


    <script src="script.js"></script>
</body>

</html>
