<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css?v=4">
    <title>HomePage</title>
</head>

<body>
    <header>
        <nav
            class="nav-bg navbar navbar-expand-lg navbar-dark bg-dark d-flex justify-content-center align-items-center">
            <img src="img/logo_melhorada.png" alt="" class="img-fluid">
        </nav>
    </header>
    <main class="container mt-4">
        <!-- Seção Projetos Prontos -->
        <section>
            <h2 class="text-uppercase">Projetos Prontos</h2>
            <div class="row mb-4">
                <article data-id='1' class="col-md-3">
                    <a href="teste.html">
                        <figure class="projeto-card">
                            <div class="grid-fundo"></div>
                            <figcaption class="text-center mt-2">Casa 3 quartos</figcaption>
                        </figure>
                    </a>
                    <p>casa</p>
                </article>
                <article data-id='2' class="col-md-3">
                    <a href="teste.html">
                        <figure class="projeto-card">
                            <div class="grid-fundo"></div>
                            <figcaption class="text-center mt-2">Casa 2 quartos</figcaption>
                        </figure>
                    </a>
                    <p>casa</p>
                </article>
                <article data-id='3' class="col-md-3">
                    <a href="teste.html">
                        <figure class="projeto-card">
                            <div class="grid-fundo"></div>
                            <figcaption class="text-center mt-2">Casa 2 quartos 1 suíte</figcaption>
                        </figure>
                    </a>
                    <p>casa</p>
                </article>
                <article data-id='4' class="col-md-3">
                    <a href="teste.html">
                        <figure class="projeto-card">
                            <div class="grid-fundo"></div>
                            <figcaption class="text-center mt-2">Casa 1 quarto 1 suíte</figcaption>
                        </figure>
                    </a>
                    <p>casa</p>
                </article>
            </div>
        </section>

        <hr class="linha-separadora">

        <!-- Seção Meus Projetos -->
        <div id="carrossel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
            </div>
            <a class="carousel-control-prev" href="#carrossel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#carrossel" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>
        </div>
        <!-- Link para o JS do Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    </main>

    <footer>
        <div class="footer-top">
            <div class="footer-item">
                <i class="fas fa-calculator"></i> <!-- Ícone de calculadora -->
                <p>Calcule a quantidade de materiais necessários utilizando as medidas da sua construção</p>
                <i class="fas fa-arrow-right"></i> <!-- Ícone de seta -->
            </div>
        </div>
        <hr class="linha-separadora">
        <div class="footer-bottom">
            <div class="footer-item">
                <i class="fas fa-info-circle"></i> <!-- Ícone de calculadora -->
                <p>Calcule a quantidade de materiais necessários utilizando as medidas da sua construção</p>
                <i class="fas fa-arrow-right"></i> <!-- Ícone de seta -->
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Seleciona todos os projetos na página inicial
            const projetos = document.querySelectorAll("article");
            projetos.forEach(projeto => {
                projeto.addEventListener("click", function () {
                    // Captura o ID do projeto clicado
                    const id = this.getAttribute("data-id");
                    if (id) {
                        console.log("Projeto selecionado:", id);
                        localStorage.setItem("idProjeto", id); // Salva no localStorage
                        window.location.href = "teste.html"; // Redireciona para a página de desenho
                    }
                });
            });
        });
    </script>

</body>

</html>
